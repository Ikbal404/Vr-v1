<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame AR.js (Marker Preset - Keep Visible)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body style='margin: 0px; overflow: hidden;'>

    <script>
        AFRAME.registerComponent('keep-visible', {
            init: function() {
                const marker = this.el; // Ini adalah elemen <a-marker>
                const sceneEl = document.querySelector('a-scene');
                const patung = document.querySelector('#patung-ar');

                // 1. Dengar event saat MARKER TERDETEKSI
                marker.addEventListener('markerFound', function() {
                    console.log('Penanda Ditemukan: Mode Pelacakan Aktif');
                    // Patung adalah anak dari marker, sehingga AR.js yang mengurusnya
                });

                // 2. Dengar event saat MARKER HILANG
                marker.addEventListener('markerLost', function() {
                    console.log('Penanda Hilang: Membekukan posisi objek.');

                    // Jika patung sudah dipindahkan, jangan lakukan apa-apa
                    if (patung.parentNode === sceneEl) {
                        return;
                    }

                    // A. Dapatkan posisi global (posisi patung di dunia nyata)
                    const worldPosition = new THREE.Vector3();
                    patung.object3D.getWorldPosition(worldPosition);

                    const worldRotation = new THREE.Euler();
                    patung.object3D.getWorldRotation(worldRotation);

                    // B. Hapus patung dari <a-marker>
                    marker.removeChild(patung);

                    // C. Tambahkan patung sebagai anak langsung dari <a-scene> (dunia)
                    sceneEl.appendChild(patung);

                    // D. Terapkan posisi dan rotasi global yang didapat
                    patung.setAttribute('position', worldPosition);
                    patung.setAttribute('rotation', {
                        x: THREE.MathUtils.radToDeg(worldRotation.x),
                        y: THREE.MathUtils.radToDeg(worldRotation.y),
                        z: THREE.MathUtils.radToDeg(worldRotation.z)
                    });
                });
            }
        });
    </script>
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; 
              debugUIEnabled: false;
              trackingMethod: best;
              detectionMode: mono_and_matrix;"
        renderer="colorManagement: true;"> 

        <a-marker preset='hiro' keep-visible> 
            
            <a-gltf-model 
                id="patung-ar" src="scene.gltf" 
                position='0 0.1 0'          
                scale="10 10 10" 
                rotation='0 0 0'>
            </a-gltf-model>

            <a-entity light="type: ambient; intensity: 0.9"></a-entity>
            <a-entity light="type: directional; intensity: 0.8; color: #FFFFFF" position="2 3 5"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
    
</body>
</html>
