<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame AR.js (Touchstart di Tengah)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        .a-canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"> 

        <a-box
            id="objek-ar"
            position="0 -999 -999"  rotation="0 45 0"
            width="0.5" 
            height="0.5" 
            depth="0.5" 
            color="#FF5500" 
            scale="1 1 1">
        </a-box>

        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 0.6" position="1 1 1"></a-entity>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        // Pastikan pustaka Three.js dimuat (penting untuk Vector3)
        const threeScript = document.createElement('script');
        threeScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        document.head.appendChild(threeScript);


        // --- LOGIKA PENEMPATAN MENGGUNAKAN TOUCHSTART MENTAH ---
        function setupTouchPlacement() {
            const objekAR = document.querySelector('#objek-ar');
            const camera = document.querySelector('a-entity[camera]');
            const canvas = document.querySelector('.a-canvas'); // Dapatkan elemen Canvas AR.js

            if (!canvas || !camera || !objekAR) {
                // Tunggu sebentar jika elemen belum dimuat
                setTimeout(setupTouchPlacement, 100); 
                return;
            }

            // Gunakan event 'touchstart' pada canvas AR.js
            canvas.addEventListener('touchstart', function(evt) {
                
                // Pastikan hanya satu sentuhan (tap)
                if (evt.touches.length > 1) {
                    return; 
                }

                // 1. Dapatkan Objek Kamera Three.js
                const cameraObject3D = camera.object3D;
                
                // 2. Hitung Arah Pandang Kamera (Lurus ke depan)
                let direction = new THREE.Vector3();
                cameraObject3D.getWorldDirection(direction);
                
                // 3. Tentukan Jarak (2 meter di depan)
                const distance = 2; 

                // 4. Hitung Posisi Baru di depan kamera
                const newPosition = cameraObject3D.position.clone().add(direction.multiplyScalar(distance));
                
                // Terapkan posisi baru ke kubus
                objekAR.setAttribute('position', {
                    x: newPosition.x,
                    y: newPosition.y, 
                    z: newPosition.z 
                });

                console.log('Kubus ditempatkan di titik sentuh: ', objekAR.getAttribute('position'));
                
                // Cegah event lain yang berpotensi memindahkan kamera
                evt.preventDefault(); 
            }, false);
            
            console.log('Setup Touchstart Selesai.');
        }

        // Panggil setup setelah AR.js dimuat
        document.querySelector('a-scene').addEventListener('arjs-loaded', setupTouchPlacement);
        
    </script>
    
</body>
</html>
