<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame GLTF AR.js (Tap-to-Place - Final Fix)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        .a-canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"> 

        <a-gltf-model 
            id="patung"
            src="scene.gltf" 
            position="0 -999 -999"  
            scale="2 2 2"             
            rotation="0 0 0"> 
        </a-gltf-model>

        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 0.6" position="1 1 1"></a-entity>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        // Gunakan fungsi defer untuk memastikan A-Frame siap
        AFRAME.registerComponent('tap-to-place', {
            init: function() {
                const patung = document.querySelector('#patung');
                const sceneEl = this.el;
                const camera = document.querySelector('a-entity[camera]');
                
                // Mendengarkan event Touchend yang lebih andal daripada 'click' di ponsel
                sceneEl.addEventListener('touchend', function (evt) {
                    
                    // Pastikan sentuhan hanya satu jari (tap tunggal)
                    if (evt.touches && evt.touches.length > 0) {
                        return; // Jika ada lebih dari satu sentuhan (pinch), abaikan
                    }

                    // --- LOGIKA PENEMPATAN ---
                    
                    // 1. Dapatkan Posisi Kamera saat ini
                    const cameraObject3D = camera.object3D;
                    
                    // 2. Hitung Arah Pandang Kamera
                    let direction = new THREE.Vector3();
                    cameraObject3D.getWorldDirection(direction);
                    
                    // 3. Tentukan Jarak (Misalnya, 2 meter di depan)
                    const distance = 2; 

                    // 4. Hitung Posisi Baru
                    const newPosition = cameraObject3D.position.clone().add(direction.multiplyScalar(distance));
                    
                    // Terapkan posisi baru ke patung
                    // Angkat sedikit di sumbu Y (ketinggian) agar tidak tenggelam.
                    // Gunakan posisi Y global: newPosition.y + 0.5
                    patung.setAttribute('position', {
                        x: newPosition.x,
                        y: newPosition.y, // Posisi Y sudah benar secara relatif
                        z: newPosition.z 
                    });
                    
                    // 5. Atur Skala (opsional, tetapi memastikan skala benar)
                    patung.setAttribute('scale', '2 2 2');
                    
                    // 6. Atur Rotasi (Opsional: menghadap pengguna)
                    patung.object3D.lookAt(cameraObject3D.position);
                    
                    console.log('Patung dipindahkan ke:', patung.getAttribute('position'));
                });
            }
        });
        
        // Tambahkan komponen baru ke scene setelah AR.js dimuat
        sceneEl.addEventListener('arjs-loaded', function() {
            sceneEl.setAttribute('tap-to-place', '');
        });
        
        // PENTING: Jika objek Three.js tidak didefinisikan, tambahkan referensi Three.js
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        document.head.appendChild(script);

    </script>
    
</body>
</html>
