<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame GLTF Augmented Reality</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.1.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe-layout-component@3.0.0/dist/aframe-layout-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/wmurphyrd/aframe-super-hands-component@touch-events/dist/aframe-super-hands-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-touch-controls@0.0.1/dist/aframe-touch-controls.min.js"></script>


    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <a-scene 
        renderer="logarithmicDepthBuffer: true"
        ar-mode-ui="enabled: true"
        vr-mode-ui="enabled: false"> 

        <a-gltf-model 
            src="scene.gltf" 
            position="0 3 -3"           
            scale="5 5 5"             
            shadow
            grabbable                 
            stretchable               
            touch-scale               
            touch-rotate>             
        </a-gltf-model>

        <a-plane 
            position="0 0 0" 
            rotation="-90 0 0" 
            width="10" 
            height="10" 
            color="#7BC8A4" 
            opacity="0.0"  shadow>
        </a-plane>

        <a-entity light="type: ambient; color: #BBB; intensity: 0.5"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 1 1"></a-entity>

        <a-entity 
            id="rig" 
            movement-controls="speed: 0.2">
            
            <a-camera 
                position="0 1.6 0"        
                look-controls 
                wasd-controls>
            </a-camera>
            
            <a-entity 
                super-hands="colliderEvent:raycaster-intersection; grabStartButtons: trackpad, trigger; grabEndButtons: trackpad, trigger"
                hand-controls="hand: left" 
                laser-controls 
                raycaster="objects: [grabbable, stretchable]"
                pinchable> 
            </a-entity>

            <a-entity 
                super-hands="colliderEvent:raycaster-intersection; grabStartButtons: trackpad, trigger; grabEndButtons: trackpad, trigger"
                hand-controls="hand: right" 
                laser-controls 
                raycaster="objects: [grabbable, stretchable]"
                pinchable> 
            </a-entity>

        </a-entity>
        
    </a-scene>
    
</body>
</html>
