<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame AR.js (Final Raycasting Test - Markerless)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        .a-canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body style='margin: 0px; overflow: hidden;'>

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        
        renderer="colorManagement: true;"
        
        cursor="rayOrigin: mouse; fuse: false;"
        raycaster="objects: .raycast-target;"> 

        <a-gltf-model 
            id="patung-ar"
            src="scene.gltf" 
            position="0 -999 -999"  scale="1 1 1"
            rotation="0 0 0">
        </a-gltf-model>

        <a-plane 
            class="raycast-target" 
            rotation="-90 0 0" 
            width="100" 
            height="100" 
            visible="false" 
            material="transparent: true; opacity: 0;"></a-plane>


        <a-entity light="type: ambient; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; intensity: 0.8; color: #FFFFFF" position="2 3 5"></a-entity>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        // Gunakan fungsi defer untuk memastikan A-Frame siap
        AFRAME.registerComponent('ar-tap-placement', {
            init: function() {
                const patung = document.querySelector('#patung-ar');
                const sceneEl = this.el;
                
                // Mendengarkan event 'click' dari raycaster A-Frame
                sceneEl.addEventListener('click', function (evt) {
                    
                    // Pastikan sentuhan berhasil mengenai target raycast (plane tak terlihat)
                    if (evt.detail.intersection) {
                        const intersection = evt.detail.intersection.point;
                        
                        // Pindahkan patung ke titik yang ditabrak oleh raycaster
                        patung.setAttribute('position', {
                            x: intersection.x,
                            // Angkat patung dari titik intersection agar tidak tenggelam di lantai
                            y: intersection.y + 0.1, 
                            z: intersection.z
                        });
                        
                        // Set skala yang sudah terbukti pas
                        patung.setAttribute('scale', '1 1 1'); 

                        console.log('Patung ditempatkan di titik:', intersection);
                        
                    } else {
                        console.log('Klik tidak mengenai target raycast (plane).');
                    }
                });
                console.log('Component AR Tap Placement siap.');
            }
        });

        // Tambahkan komponen setelah scene dan AR.js dimuat
        document.querySelector('a-scene').addEventListener('loaded', function() {
            document.querySelector('a-scene').setAttribute('ar-tap-placement', '');
        });
    </script>
</body>
</html>
