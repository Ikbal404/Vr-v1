<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Three.js WebXR AR Hit Test (Perbaikan Kamera)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 100; /* Penting agar tombol berada di atas canvas */
        }
    </style>
</head>
<body>

    <button id="ar-button">MULAI AR (MARKERLESS)</button>

    <script>
        let camera, scene, renderer;
        let controller;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let reticle;
        let patung;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            
            // 1. Renderer: Wajib alpha: true (transparan) agar kamera terlihat
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); 
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.xr.enabled = true; 
            document.body.appendChild(renderer.domElement);

            // 2. Kamera dan Pencahayaan
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
            
            // Perbaikan Pencahayaan: Menambahkan HemiLight untuk menerangi objek dengan baik di AR
            scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xBBBBFF, 1));
            
            // 3. Loader GLTF
            const loader = new THREE.GLTFLoader();
            loader.load('scene.gltf', function(gltf) {
                patung = gltf.scene;
                patung.scale.set(1.5, 1.5, 1.5);
                patung.visible = false;
                scene.add(patung);
            });
            
            // 4. Reticle (Indikator Penempatan)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xFFFFFF })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // 5. Setup WebXR Controller dan Tap Event
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // 6. Setup AR Button
            document.getElementById('ar-button').addEventListener('click', function() {
                // Pastikan browser mendukung AR mode
                if (navigator.xr && navigator.xr.isSessionSupported) {
                    navigator.xr.isSessionSupported('immersive-ar').then(function(supported) {
                        if (supported) {
                            // Coba memulai sesi AR
                            navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'] })
                                .then(onSessionStarted)
                                .catch(err => {
                                    console.error('WebXR AR mode gagal:', err);
                                    alert('Gagal memulai sesi AR. Pastikan ARCore diinstal dan izin kamera diberikan.');
                                });
                        } else {
                            alert('Perangkat Anda tidak mendukung WebXR AR mode.');
                        }
                    });
                } else {
                    alert('WebXR API tidak tersedia di browser Anda.');
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onSessionStarted(session) {
            session.addEventListener('end', onSessionEnded);
            renderer.xr.setSession(session);
            document.getElementById('ar-button').textContent = "KELUAR AR";
        }

        function onSessionEnded() {
            document.getElementById('ar-button').textContent = "MULAI AR (MARKERLESS)";
            hitTestSource = null;
            hitTestSourceRequested = false;
        }

        function onSelect() {
            if (reticle.visible && patung) {
                // Klon patung dan letakkan di posisi reticle
                const placedPatung = patung.clone();
                // Gunakan rotasi reticle untuk penempatan yang benar
                placedPatung.position.setFromMatrixPosition(reticle.matrix);
                placedPatung.rotation.setFromRotationMatrix(reticle.matrix); 
                placedPatung.visible = true;
                scene.add(placedPatung);
            }
        }

        function requestHitTestSource(session) {
            session.requestReferenceSpace('viewer').then(function(referenceSpace) {
                session.requestHitTestSource({ space: referenceSpace }).then(function(source) {
                    hitTestSource = source;
                });
            });
            hitTestSourceRequested = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- LOOP UTAMA THREE.JS ---
        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) requestHitTestSource(session);

                if (hitTestSource) {
                    const referenceSpace = renderer.xr.getReferenceSpace();
                    // Get pose of the camera from the WebXR frame
                    const pose = frame.getViewerPose(referenceSpace);
                    if (pose) {
                        // Update camera position and rotation based on WebXR tracking
                        const view = pose.views[0];
                        camera.matrix.fromArray(view.transform.matrix);
                        camera.updateMatrixWorld(true);
                        
                        // Perform hit test
                        const hitTestResults = frame.getHitTestResults(hitTestSource);

                        if (hitTestResults.length) {
                            const hit = hitTestResults[0];
                            reticle.visible = true;
                            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                        } else {
                            reticle.visible = false;
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
