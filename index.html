<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame AR.js (Marker Freeze - Alternatif)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body style='margin: 0px; overflow: hidden;'>

    <script>
        AFRAME.registerComponent('freeze-on-lost', {
            init: function() {
                const marker = this.el; // <a-marker>
                
                // Mencegah AR.js menyembunyikan objek saat marker hilang
                marker.addEventListener('markerLost', function() {
                    console.log('Marker Lost: Freeze object.');
                    
                    // Menonaktifkan visual marker (agar tidak melayang), tetapi 
                    // menjaga objek 3D di posisi terakhir yang terlacak.
                    // Ini kadang-kadang menipu AR.js agar objek tetap di scene.
                    marker.setAttribute('visible', 'false');
                });

                marker.addEventListener('markerFound', function() {
                    console.log('Marker Found: Re-enable tracking.');
                    // Mengaktifkan kembali visual marker untuk pelacakan normal
                    marker.setAttribute('visible', 'true');
                });
            }
        });
    </script>
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; 
              debugUIEnabled: false;
              trackingMethod: best;
              detectionMode: mono_and_matrix;"
        renderer="colorManagement: true;"> 

        <a-marker preset='hiro' freeze-on-lost> 
            
            <a-gltf-model 
                id="patung-ar" 
                src="scene.gltf" 
                position='0 0.1 0'          
                scale="8 8 8" 
                rotation='0 0 0'>
            </a-gltf-model>

            <a-entity light="type: ambient; intensity: 0.9"></a-entity>
            <a-entity light="type: directional; intensity: 0.8; color: #FFFFFF" position="2 3 5"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
    
</body>
</html>
