<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame GLTF Movable Object</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.1.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <a-scene 
        cursor="rayOrigin: mouse"
        raycaster="objects: [grabbable];"
        vr-mode-ui="enabled: true">

        <a-gltf-model 
            src="scene.gltf" 
            position="0 0 -3"           
            scale="1 1 1"        shadow
            
            grabbable>               </a-gltf-model>

        <a-plane 
            position="0 0 0" 
            rotation="-90 0 0" 
            width="10" 
            height="10" 
            color="#7BC8A4" 
            shadow>
        </a-plane>

        <a-entity light="type: ambient; color: #BBB; intensity: 0.5"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 1 1"></a-entity>

        <a-entity 
            id="rig" 
            movement-controls="speed: 0.2">
            
            <a-camera 
                position="0 1.6 0" 
                look-controls 
                wasd-controls>
            </a-camera>
            
            <a-entity 
                hand-controls="hand: left" 
                laser-controls 
                raycaster="objects: [grabbable]"
                pinchable> </a-entity>

            <a-entity 
                hand-controls="hand: right" 
                laser-controls 
                raycaster="objects: [grabbable]"
                pinchable> </a-entity>

        </a-entity>
        
    </a-scene>
    
</body>
</html>
