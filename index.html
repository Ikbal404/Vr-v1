<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame AR.js (Tap-to-Raycast ke Plane)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        .a-canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        
        cursor="rayOrigin: mouse; fuse: false;"
        raycaster="objects: .raycast-target;"> 

        <a-box
            id="objek-ar"
            position="0 -999 -999"  rotation="0 45 0"
            width="0.5" 
            height="0.5" 
            depth="0.5" 
            color="#FF5500" 
            scale="1 1 1">
        </a-box>
        
        <a-plane 
            name="floor"
            class="raycast-target"
            rotation="-90 0 0" 
            width="10" 
            height="10" 
            visible="false" 
            material="transparent: true; opacity: 0;"></a-plane>


        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 0.6" position="1 1 1"></a-entity>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        // Gunakan fungsi defer untuk memastikan A-Frame siap
        AFRAME.registerComponent('tap-raycaster', {
            init: function() {
                const objekAR = document.querySelector('#objek-ar');
                const sceneEl = this.el;
                
                sceneEl.addEventListener('click', function (evt) {
                    
                    // Pastikan klik berhasil mengenai objek virtual (plane tak terlihat)
                    if (evt.detail.intersection) {
                        const intersection = evt.detail.intersection.point;
                        
                        // Pindahkan kubus ke titik yang ditabrak oleh raycaster
                        objekAR.setAttribute('position', {
                            x: intersection.x,
                            y: intersection.y + 0.25, // Angkat setengah tinggi kubus (0.5/2 = 0.25)
                            z: intersection.z
                        });
                        
                        console.log('Kubus ditempatkan di titik:', intersection);
                        
                    } else {
                        // Jika klik tidak mengenai plane
                        console.log('Klik tidak mengenai target raycast (plane).');
                    }
                });
                
                console.log('Raycaster Click Listener siap.');
            }
        });

        // PENTING: Menambahkan komponen 'tap-raycaster' setelah AR.js dimuat
        sceneEl.addEventListener('arjs-loaded', function() {
            sceneEl.setAttribute('tap-raycaster', '');
        });
        
    </script>
    
</body>
</html>
