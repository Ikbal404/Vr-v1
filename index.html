<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Three.js WebXR AR Hit Test (Markerless)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <button id="ar-button">MULAI AR (MARKERLESS)</button>

    <script>
        let camera, scene, renderer;
        let controller;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let reticle; // Indikator di lantai
        let patung;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            
            // 1. Renderer (Menggunakan WebGL)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.xr.enabled = true; // KRITIS untuk AR WebXR
            document.body.appendChild(renderer.domElement);

            // 2. Kamera dan Pencahayaan
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
            scene.add(new THREE.AmbientLight(0xFFFFFF, 0.9));
            
            // 3. Loader GLTF
            const loader = new THREE.GLTFLoader();
            loader.load('scene.gltf', function(gltf) {
                patung = gltf.scene;
                // Skala dan penyesuaian awal
                patung.scale.set(1.5, 1.5, 1.5);
                patung.visible = false; // Sembunyikan sampai ada posisi
                scene.add(patung);
            });
            
            // 4. Reticle (Indikator Penempatan)
            // Reticle akan menunjukkan di mana objek akan diletakkan di lantai
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial()
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // 5. Setup WebXR Controller dan Tap Event
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // 6. Setup AR Button
            document.getElementById('ar-button').addEventListener('click', function() {
                if (renderer.xr.isPresenting) {
                    renderer.xr.exitAR();
                } else {
                    // Mulai sesi AR
                    navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'] })
                        .then(onSessionStarted)
                        .catch(err => {
                            console.error('WebXR AR mode gagal:', err);
                            alert('Perangkat Anda tidak mendukung WebXR AR mode (ARCore/ARKit) atau izin kamera ditolak.');
                        });
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onSessionStarted(session) {
            session.addEventListener('end', onSessionEnded);
            renderer.xr.setSession(session);
            document.getElementById('ar-button').textContent = "KELUAR AR";
        }

        function onSessionEnded() {
            document.getElementById('ar-button').textContent = "MULAI AR (MARKERLESS)";
            hitTestSource = null;
            hitTestSourceRequested = false;
        }

        function onSelect() {
            if (reticle.visible && patung) {
                // Klon patung dan letakkan di posisi reticle
                const placedPatung = patung.clone();
                placedPatung.position.setFromMatrixPosition(reticle.matrix);
                placedPatung.rotation.y = camera.rotation.y; 
                placedPatung.visible = true;
                scene.add(placedPatung);
            }
        }

        function requestHitTestSource(session) {
            session.requestReferenceSpace('viewer').then(function(referenceSpace) {
                session.requestHitTestSource({ space: referenceSpace }).then(function(source) {
                    hitTestSource = source;
                });
            });
            hitTestSourceRequested = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- LOOP UTAMA THREE.JS ---
        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const session = renderer.xr.getSession();

                // 1. Request Hit Test Source jika belum ada
                if (hitTestSourceRequested === false) {
                    requestHitTestSource(session);
                }

                // 2. Lakukan Hit Test (raycast di dunia nyata)
                if (hitTestSource) {
                    const referenceSpace = renderer.xr.getReferenceSpace();
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length) {
                        // Hasil hit test valid, tampilkan reticle
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        
                        // Perbarui posisi reticle ke titik hit test
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        // Tidak ada permukaan yang terdeteksi
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
