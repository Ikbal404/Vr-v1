<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame AR.js (Marker Preset - Freeze Fix)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body style='margin: 0px; overflow: hidden;'>

    <script>
        AFRAME.registerComponent('keep-visible-fix', {
            init: function() {
                const marker = this.el; // <a-marker>
                const sceneEl = document.querySelector('a-scene');
                const patung = document.querySelector('#patung-ar');
                let isFrozen = false; // Status untuk mencegah eksekusi berulang

                // 1. Dengar event saat MARKER HILANG
                marker.addEventListener('markerLost', function() {
                    if (isFrozen) return; // Sudah dibekukan

                    console.log('Penanda Hilang: Membekukan posisi objek.');
                    
                    // Dapatkan posisi dan rotasi global Three.js
                    const worldPosition = new THREE.Vector3();
                    patung.object3D.getWorldPosition(worldPosition);

                    const worldQuaternion = new THREE.Quaternion();
                    patung.object3D.getWorldQuaternion(worldQuaternion);

                    // A. Setel isFrozen menjadi true
                    isFrozen = true;

                    // B. Pindahkan Patung dari <a-marker> ke <a-scene>
                    // Ini melepaskan patung dari pelacakan penanda
                    marker.removeChild(patung);
                    sceneEl.appendChild(patung);

                    // C. Terapkan posisi dan rotasi global yang didapat
                    patung.setAttribute('position', {
                        x: worldPosition.x,
                        y: worldPosition.y,
                        z: worldPosition.z
                    });
                    
                    // Rotasi harus diterapkan menggunakan Quaternion untuk menghindari Gimbal Lock
                    // Konversi Quaternion ke Euler (Rotasi A-Frame)
                    const worldEuler = new THREE.Euler().setFromQuaternion(worldQuaternion, 'YXZ');

                    patung.setAttribute('rotation', {
                        x: THREE.MathUtils.radToDeg(worldEuler.x),
                        y: THREE.MathUtils.radToDeg(worldEuler.y),
                        z: THREE.MathUtils.radToDeg(worldEuler.z)
                    });

                    // D. Sembunyikan marker untuk membersihkan tampilan
                    marker.setAttribute('visible', false);
                });

                // 2. Dengar event saat MARKER DITEMUKAN (Jika ingin mengaktifkan pelacakan ulang)
                marker.addEventListener('markerFound', function() {
                    if (!isFrozen) return; // Belum dibekukan

                    console.log('Penanda Ditemukan Kembali: Mengembalikan pelacakan.');

                    // A. Sembunyikan patung yang beku (anak scene)
                    sceneEl.removeChild(patung);
                    
                    // B. Kembalikan patung ke <a-marker>
                    marker.appendChild(patung);

                    // C. Tampilkan kembali marker dan reset posisi/rotasi patung relatif ke marker
                    patung.setAttribute('position', '0 0.1 0');
                    patung.setAttribute('rotation', '0 0 0');
                    marker.setAttribute('visible', true);

                    isFrozen = false; // Siap untuk dibekukan lagi
                });
            }
        });
    </script>
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; 
              debugUIEnabled: false;
              trackingMethod: best;
              detectionMode: mono_and_matrix;"
        renderer="colorManagement: true;"> 

        <a-marker preset='hiro' keep-visible-fix> 
            
            <a-gltf-model 
                id="patung-ar" src="scene.gltf" 
                position='0 0.1 0'          
                scale="1.5 1.5 1.5" 
                rotation='0 0 0'>
            </a-gltf-model>

            <a-entity light="type: ambient; intensity: 0.9"></a-entity>
            <a-entity light="type: directional; intensity: 0.8; color: #FFFFFF" position="2 3 5"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
    
</body>
</html>
