<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame AR.js (Tap-to-Place dengan Kubus)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        .a-canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"> 

        <a-box
            id="objek-ar"
            position="0 -999 -999"  rotation="0 45 0"
            width="0.5" 
            height="0.5" 
            depth="0.5" 
            color="#FF5500" 
            scale="1 1 1">
        </a-box>

        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 0.6" position="1 1 1"></a-entity>

        <a-entity 
            camera 
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: [raycastable];"></a-entity>

    </a-scene>

    <script>
        // Gunakan fungsi defer untuk memastikan A-Frame siap
        AFRAME.registerComponent('tap-to-place', {
            init: function() {
                // Mengganti patung dengan kubus
                const objekAR = document.querySelector('#objek-ar');
                const sceneEl = this.el;
                const camera = document.querySelector('a-entity[camera]');
                
                // Mendengarkan event Touchend yang lebih andal daripada 'click' di ponsel
                sceneEl.addEventListener('touchend', function (evt) {
                    
                    // Pastikan sentuhan hanya satu jari (tap tunggal)
                    if (evt.touches && evt.touches.length > 0) {
                        return;
                    }
                    
                    // --- LOGIKA PENEMPATAN ---
                    
                    // 1. Dapatkan Objek Kamera Three.js
                    const cameraObject3D = camera.object3D;
                    
                    // 2. Hitung Arah Pandang Kamera
                    let direction = new THREE.Vector3();
                    cameraObject3D.getWorldDirection(direction);
                    
                    // 3. Tentukan Jarak (2 meter di depan)
                    const distance = 2; 

                    // 4. Hitung Posisi Baru di depan kamera
                    const newPosition = cameraObject3D.position.clone().add(direction.multiplyScalar(distance));
                    
                    // Terapkan posisi baru ke kubus
                    objekAR.setAttribute('position', {
                        x: newPosition.x,
                        y: newPosition.y, 
                        z: newPosition.z 
                    });
                    
                    // Opsional: Atur Rotasi agar kubus terlihat stabil
                    objekAR.setAttribute('rotation', '0 45 0');
                    
                    console.log('Kubus dipindahkan ke:', objekAR.getAttribute('position'));
                });
            }
        });
        
        // PENTING: Menambahkan komponen 'tap-to-place' setelah AR.js dimuat
        sceneEl.addEventListener('arjs-loaded', function() {
            sceneEl.setAttribute('tap-to-place', '');
        });
        
        // Pastikan pustaka Three.js dimuat untuk THREE.Vector3
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        document.head.appendChild(script);

    </script>
    
</body>
</html>
