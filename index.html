<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame WebXR Native (Last Markerless Attempt)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        .ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 100;
        }
    </style>
</head>
<body style='margin: 0px; overflow: hidden;'>

    <a-scene 
        webxr="requiredFeatures: ['hit-test', 'dom-overlay'];
               optionalFeatures: ['dom-overlay'];
               overlayElement: #ar-button;"
        
        ar-hit-test-placement 
        
        renderer="colorManagement: true;"> 

        <a-gltf-model 
            id="patung-ar"
            src="scene.gltf" 
            position="0 -999 -999"  scale="1.5 1.5 1.5"
            rotation="0 0 0">
        </a-gltf-model>

        <a-ring 
            id="reticle"
            radius-inner="0.15" 
            radius-outer="0.2" 
            rotation="-90 0 0" 
            visible="false"
            material="color: #FFFFFF; side: double;">
        </a-ring>

        <a-entity light="type: ambient; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; intensity: 0.8; color: #FFFFFF" position="2 3 5"></a-entity>

        <a-entity camera></a-entity>

    </a-scene>

    <div id="ar-button" class="ar-button">MULAI AR</div>

    <script>
        // Logika Penempatan dan Reticle (Khusus A-Frame Native)
        AFRAME.registerComponent('ar-hit-test-placement', {
            init: function() {
                const sceneEl = this.el;
                const reticle = document.querySelector('#reticle');
                const patung = document.querySelector('#patung-ar');
                const arButton = document.querySelector('#ar-button');
                
                let currentSession = null;

                // 1. Tombol untuk memulai sesi AR
                arButton.addEventListener('click', function() {
                    if (currentSession) {
                        currentSession.end();
                        currentSession = null;
                        arButton.textContent = "MULAI AR";
                        patung.setAttribute('visible', 'false');
                    } else {
                        // Memulai sesi AR, A-Frame akan mengurus sisa inisialisasi
                        sceneEl.enterAR();
                    }
                });

                // 2. Event listener untuk sesi AR
                sceneEl.addEventListener('enter-vr', function (evt) {
                    if (sceneEl.is('ar-mode')) {
                        currentSession = sceneEl.renderer.xr.getSession();
                        arButton.textContent = "KELUAR AR";

                        // 3. Logic: Tap untuk menempatkan
                        sceneEl.addEventListener('ar-hit-test-select', function(hit) {
                            if (reticle.getAttribute('visible')) {
                                const position = reticle.getAttribute('position');
                                patung.setAttribute('position', position);
                                patung.setAttribute('visible', 'true');
                            }
                        });
                    }
                });

                sceneEl.addEventListener('exit-vr', function (evt) {
                    currentSession = null;
                    arButton.textContent = "MULAI AR";
                    reticle.setAttribute('visible', 'false');
                });


                // 4. Update Reticle Position (Menggunakan event bawaan A-Frame)
                sceneEl.addEventListener('ar-hit-test-update', function(evt) {
                    if (!evt.detail.successful) {
                        reticle.setAttribute('visible', 'false');
                        return;
                    }

                    const position = evt.detail.intersection.pose.position;
                    reticle.setAttribute('position', position);
                    reticle.setAttribute('visible', 'true');
                });
            }
        });

        document.querySelector('a-scene').setAttribute('ar-hit-test-placement', '');
    </script>
</body>
</html>
