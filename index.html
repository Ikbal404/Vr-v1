<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>A-Frame GLTF AR.js (Tap-to-Place)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        /* Penting: Pastikan A-Frame canvas memenuhi layar penuh untuk AR */
        .a-canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"> 

        <a-gltf-model 
            id="patung"
            src="scene.gltf" 
            position="0 -999 -999"  scale="2 2 2"             
            rotation="0 0 0"> 
        </a-gltf-model>

        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 0.6" position="1 1 1"></a-entity>

        <a-entity 
            camera 
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: [raycastable];"></a-entity>

    </a-scene>

    <script>
        // Mendapatkan referensi ke elemen A-Frame
        const sceneEl = document.querySelector('a-scene');
        const patung = document.querySelector('#patung');
        const camera = document.querySelector('a-entity[camera]');
        
        // --- 1. SETELAH AR.JS SIAP ---
        // Mendengarkan event 'arjs-loaded' yang dipicu saat AR.js berhasil mengakses kamera
        sceneEl.addEventListener('arjs-loaded', function () {
            console.log('Mode kamera AR.js siap. Ketuk layar untuk menempatkan patung.');
        });
        
        // --- 2. EVENT PENEMPATAN OBJEK (Tap-to-Place) ---
        sceneEl.addEventListener('click', function (evt) {
            
            // Logika sederhana: tempatkan objek 2 meter di depan posisi kamera
            
            // Dapatkan posisi kamera saat ini
            const cameraPosition = camera.object3D.position;
            
            // Hitung arah kamera
            let direction = new THREE.Vector3();
            camera.object3D.getWorldDirection(direction);
            
            // Jarak yang diinginkan (2 meter di depan)
            const distance = 2; 

            // Hitung posisi baru
            const newPosition = cameraPosition.clone().add(direction.multiplyScalar(distance));
            
            // Terapkan posisi baru ke patung
            // Kita angkat sedikit di sumbu Y (0.5 meter) agar tidak tenggelam
            patung.setAttribute('position', {
                x: newPosition.x,
                y: newPosition.y - 0.5, 
                z: newPosition.z 
            });
            
            // Opsional: Atur rotasi patung agar menghadap pengguna (tergantung kebutuhan)
            patung.setAttribute('rotation', '0 180 0');

            console.log('Patung dipindahkan ke:', patung.getAttribute('position'));
        });
        
        // Tambahkan pustaka Three.js agar kita dapat menggunakan THREE.Vector3 dan THREE.Raycaster
        // (AR.js sudah mengimpornya, tapi ini untuk kejelasan)
    </script>
    
</body>
</html>
